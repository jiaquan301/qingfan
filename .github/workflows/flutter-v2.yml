name: Qingfan Flutter V2 candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qingfan-v2-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  linux:
    name: Ubuntu Linux build, native window and deb
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install native Linux build and window validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            xvfb dbus-x11 openbox wmctrl xdotool x11-utils x11-xserver-utils imagemagick picom fonts-noto-cjk
      - name: Reproducibly generate Flutter desktop runners
        working-directory: flutter_app
        run: |
          flutter create --no-pub --project-name qingfan --platforms=linux,windows,macos .
          python3 tool/patch_linux_runner.py
          flutter pub get
      - name: Verify committed dependency lock is reproducible
        working-directory: flutter_app
        run: git diff --exit-code -- pubspec.lock
      - name: Static analysis
        working-directory: flutter_app
        run: flutter analyze --no-pub
      - name: Domain and UI regression
        working-directory: flutter_app
        run: flutter test --no-pub
      - name: Linux release build
        working-directory: flutter_app
        run: flutter build linux --release --no-pub
      - name: Actual native X11 window acceptance
        working-directory: flutter_app
        run: dbus-run-session -- xvfb-run -a env QINGFAN_NATIVE_CAPTURE=1 bash tool/native_smoke.sh
      - name: Debian installer candidate
        working-directory: flutter_app
        run: bash tool/package_linux.sh
      - name: Verify Debian package install, launch and uninstall
        working-directory: flutter_app
        run: |
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/lib/qingfan/qingfan
          test -f /usr/share/applications/qingfan.desktop
          tmp_home="$(mktemp -d)"
          trap 'rm -rf "$tmp_home"' EXIT
          export HOME="$tmp_home"
          export XDG_DATA_HOME="$tmp_home/.local/share"
          export XDG_CONFIG_HOME="$tmp_home/.config"
          export XDG_CACHE_HOME="$tmp_home/.cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          timeout 35s dbus-run-session -- xvfb-run -a bash -euo pipefail -c '
            openbox >/tmp/qingfan-installed-openbox.log 2>&1 &
            openbox_pid=$!
            picom --backend xrender --config /dev/null >/tmp/qingfan-installed-picom.log 2>&1 &
            picom_pid=$!
            trap "kill $openbox_pid $picom_pid 2>/dev/null || true" EXIT
            sleep 1
            timeout 30s /usr/lib/qingfan/qingfan --native-smoke 2>&1 | tee /tmp/qingfan-installed-smoke.log
            grep -q "NATIVE_TOPMOST_SURFACE settings reported=true" /tmp/qingfan-installed-smoke.log
            grep -q "NATIVE_TOPMOST_RESET reported=false" /tmp/qingfan-installed-smoke.log
            grep -q "NATIVE_SMOKE_TOPMOST_ALL_SURFACES_PASS" /tmp/qingfan-installed-smoke.log
            grep -q "NATIVE_SMOKE_PASS" /tmp/qingfan-installed-smoke.log
          '
          cp /tmp/qingfan-installed-smoke.log package-smoke.log
          sudo apt-get remove -y qingfan
          test ! -e /usr/lib/qingfan/qingfan
          echo "LINUX_DEB_INSTALL_LAUNCH_UNINSTALL_PASS"
      - name: Save Linux deb and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingfan-v2-ubuntu-deb
          path: |
            flutter_app/dist/*.deb
            flutter_app/pubspec.lock
            flutter_app/native-smoke.log
            flutter_app/package-smoke.log
            flutter_app/native-shots/*.png
          if-no-files-found: warn

  windows:
    name: Windows native release and installer acceptance
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Generate pinned Windows runner
        working-directory: flutter_app
        run: |
          flutter create --no-pub --project-name qingfan --platforms=windows .
          flutter pub get
      - name: Verify Windows dependency lock
        working-directory: flutter_app
        shell: pwsh
        run: |
          git diff --exit-code -- pubspec.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Analyze and run tests
        working-directory: flutter_app
        shell: pwsh
        run: |
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows x64 release bundle
        working-directory: flutter_app
        run: flutter build windows --release --no-pub
      - name: Verify Windows release bundle
        working-directory: flutter_app
        shell: pwsh
        run: |
          $root = "build/windows/x64/runner/Release"
          @("qingfan.exe", "flutter_windows.dll", "data/flutter_assets") | ForEach-Object {
            if (-not (Test-Path (Join-Path $root $_))) { throw "Windows release missing: $_" }
          }
          Write-Output "WINDOWS_RELEASE_BUNDLE_PASS"
      - name: Native Windows release window acceptance
        working-directory: flutter_app
        shell: pwsh
        run: ./tool/native_smoke_windows.ps1
      - name: Package portable candidate
        working-directory: flutter_app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/qingfan-v2-windows-x64-unsigned.zip" -Force
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Windows installer (unsigned test candidate)
        working-directory: flutter_app
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" tool/qingfan_windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows installer and uninstaller
        working-directory: flutter_app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem 'dist/qingfan-v2-windows-x64-installer-unsigned.exe').FullName
          $location = Join-Path $env:RUNNER_TEMP 'QingfanTestInstall'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$location") -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Inno installer returned $($setup.ExitCode)" }
          if (-not (Test-Path (Join-Path $location 'qingfan.exe'))) { throw 'Installed qingfan.exe missing' }
          ./tool/native_smoke_windows.ps1 -Executable (Join-Path $location 'qingfan.exe')
          $uninstaller = Join-Path $location 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Inno uninstaller missing' }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru -Wait
          if ($remove.ExitCode -ne 0) { throw "Inno uninstaller returned $($remove.ExitCode)" }
          if (Test-Path (Join-Path $location 'qingfan.exe')) { throw 'Windows uninstaller left executable behind' }
          Write-Output 'WINDOWS_INSTALL_UNINSTALL_PASS'
      - name: Windows portable and installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingfan-v2-windows-installer
          path: |
            flutter_app/dist/*.exe
            flutter_app/windows-native-smoke.log
            flutter_app/windows-native-stderr.log
            flutter_app/windows-native-desktop.png
          if-no-files-found: warn
      - name: Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingfan-v2-windows-portable
          path: flutter_app/dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS native release and DMG acceptance
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Generate pinned macOS runner
        working-directory: flutter_app
        run: |
          flutter create --no-pub --project-name qingfan --platforms=macos .
          flutter pub get
      - name: Verify macOS dependency lock
        working-directory: flutter_app
        run: git diff --exit-code -- pubspec.lock
      - name: Analyze and run tests
        working-directory: flutter_app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: macOS release bundle (unsigned)
        working-directory: flutter_app
        run: flutter build macos --release --no-pub
      - name: Native macOS release window acceptance
        working-directory: flutter_app
        run: bash tool/native_smoke_macos.sh
      - name: Verify macOS app bundle
        working-directory: flutter_app
        run: |
          test -x build/macos/Build/Products/Release/qingfan.app/Contents/MacOS/qingfan
          test -f build/macos/Build/Products/Release/qingfan.app/Contents/Info.plist
          plutil -lint build/macos/Build/Products/Release/qingfan.app/Contents/Info.plist
          echo "MACOS_APP_BUNDLE_PASS"
      - name: Package unsigned test candidate
        working-directory: flutter_app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/qingfan.app dist/qingfan-v2-macos-unsigned.zip
      - name: macOS unsigned DMG for testing
        working-directory: flutter_app
        run: |
          hdiutil create -volname Qingfan -srcfolder build/macos/Build/Products/Release/qingfan.app -ov -format UDZO dist/qingfan-v2-macos-unsigned.dmg
      - name: Verify unsigned DMG can be mounted and unmounted
        working-directory: flutter_app
        run: |
          volume="$RUNNER_TEMP/QingfanMount"
          mkdir -p "$volume"
          hdiutil attach dist/qingfan-v2-macos-unsigned.dmg -nobrowse -readonly -mountpoint "$volume"
          trap 'hdiutil detach "$volume" -force || true' EXIT
          test -x "$volume/qingfan.app/Contents/MacOS/qingfan"
          hdiutil detach "$volume"
          trap - EXIT
          echo "MACOS_DMG_MOUNT_UNMOUNT_PASS"
      - name: macOS candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingfan-v2-macos-app-unsigned
          path: |
            flutter_app/dist/*.zip
            flutter_app/dist/*.dmg
            flutter_app/macos-native-smoke.log
            flutter_app/macos-native-desktop.png
          if-no-files-found: warn
